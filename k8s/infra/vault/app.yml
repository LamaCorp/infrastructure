---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-vault
  labels:
    app: infra-vault
spec:
  project: infra
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
  destination:
    name: k3s.fsn.as212024.net
    namespace: infra-vault
  sources:
    - repoURL: https://github.com/LamaCorp/infrastructure.git
      targetRevision: HEAD
      ref: infrastructure
    - repoURL: oci://ghcr.io/openbao/charts/openbao
      targetRevision: 0.29.4
      chart: openbao
      helm:
        releaseName: vault
        valueFiles:
          - $infrastructure/k8s/infra/vault/values.yml
    - repoURL: https://github.com/LamaCorp/infrastructure.git
      targetRevision: HEAD
      path: k8s/infra/vault/extra

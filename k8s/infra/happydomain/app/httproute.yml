---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: happydomain
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-http01-eg
    cert-manager.io/private-key-algorithm: ECDSA
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    namespace: core-eg
    name: eg-http-critical
  listeners:
    - name: https
      hostname: dns.as212024.net
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: happydomain-https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: happydomain
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: happydomain
  hostnames:
    - dns.as212024.net
  rules:
    - matches:
        - path:
            value: "/"
      backendRefs:
        - name: happydomain
          port: 80

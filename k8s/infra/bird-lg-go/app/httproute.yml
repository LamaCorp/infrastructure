---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: bird-lg-go
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-http01-eg
    cert-manager.io/private-key-algorithm: ECDSA
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    namespace: core-eg
    name: eg-http-public
  listeners:
    - name: https
      hostname: lg.as212024.net
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: bird-lg-go-https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bird-lg-go
spec:
  parentRefs:
    - group: gateway.networking.k8s.io/v1
      kind: ListenerSet
      name: bird-lg-go
  hostnames:
    - lg.as212024.net
  rules:
    - matches:
        - path:
            value: "/"
      backendRefs:
        - name: bird-lg-go
          port: 80

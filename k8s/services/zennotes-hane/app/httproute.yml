---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: zennotes
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-http01-eg
    cert-manager.io/private-key-algorithm: ECDSA
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    namespace: core-eg
    name: eg-http-public
  listeners:
    - name: https
      hostname: zen-hane.sdlh.eu
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: zennotes-https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zennotes
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: zennotes
  hostnames:
    - zen-hane.sdlh.eu
  rules:
    - matches:
        - path:
            value: "/"
      backendRefs:
        - name: zennotes
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: zennotes
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: zennotes
  oidc:
    provider:
      issuer: https://auth.sdlh.eu/application/o/zennotes-hane/
    clientID: zennotes-hane
    clientSecret:
      name: zennotes-oidc-credentials
    scopes:
      - offline_access
    refreshToken: true

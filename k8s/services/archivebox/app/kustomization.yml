---
kind: Kustomization

commonLabels:
  app.kubernetes.io/name: archivebox

resources:
  - deployment.yml
  - httproute.yml
  - network-policy.yml
  - pvc.yml
  - secrets.yml
  - service.yml

configMapGenerator:
  - name: archivebox-config
    literals:
      - PUBLIC_INDEX=True
      - PUBLIC_SNAPSHOTS=True
      - PUBLIC_ADD_VIEW=False
      - REVERSE_PROXY_USER_HEADER=X-authentik-username
      - REVERSE_PROXY_WHITELIST=172.28.128.0/22,2001:67c:17fc:110::/60
      - BASE_URL=https://archive.lama-corp.space

images:
  - name: ghcr.io/archivebox/archivebox
    newTag: 0.9.51@sha256:7fd772baa880b8f2b388aee587d2675cfdba5cc7782b7c37594939697711109e

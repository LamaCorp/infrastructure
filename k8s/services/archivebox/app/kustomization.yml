---
kind: Kustomization

commonLabels:
  app.kubernetes.io/name: archivebox

resources:
  - deployment.yml
  - httproute.yml
  - network-policy.yml
  - pvc.yml
  - secrets.yml
  - service.yml

configMapGenerator:
  - name: archivebox-config
    literals:
      - BASE_URL=https://archive.lama-corp.space
      - PUBLIC_INDEX=True
      - PUBLIC_ADD_VIEW=False
      - PERMISSIONS=public
      - REVERSE_PROXY_USER_HEADER=X-Remote-User
      - REVERSE_PROXY_WHITELIST=172.28.128.0/22
      - LOGOUT_REDIRECT_URL=https://archive.lama-corp.space/logout

images:
  - name: ghcr.io/archivebox/archivebox
    newTag: 0.9.77@sha256:f63170551ec48d7aa087c71e2d093156dbf4b4ed8680e2f97f22483e3bc71e55

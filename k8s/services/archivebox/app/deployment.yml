---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archivebox
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  template:
    spec:
      initContainers:
        - name: init
          image: ghcr.io/archivebox/archivebox
          args: ["init"]
          envFrom:
            - configMapRef:
                name: archivebox-config
          volumeMounts:
            - name: data
              mountPath: /data
        - name: update
          image: ghcr.io/archivebox/archivebox
          args: ["update", "--migrate-only"]
          envFrom:
            - configMapRef:
                name: archivebox-config
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: archivebox
          image: ghcr.io/archivebox/archivebox
          args: ["server", "--init", "[::]:8000"]
          envFrom:
            - configMapRef:
                name: archivebox-config
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: archivebox-data

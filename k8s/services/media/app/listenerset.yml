    - name: qbittorrent
      hostname: qbittorrent.lama-corp.space
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: media-https
    - name: radarr
      hostname: radarr.lama-corp.space
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: media-https
    - name: sabnzbd

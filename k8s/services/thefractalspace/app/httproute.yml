---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: thefractalspace
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-http01-eg
    cert-manager.io/private-key-algorithm: ECDSA
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    namespace: core-eg
    name: eg-http-public
  listeners:
    - name: https
      hostname: thefractal.space
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: thefractalspace-https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thefractalspace
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: thefractalspace
  hostnames:
    - thefractal.space
  rules:
    - matches:
        - path:
            value: "/"
      backendRefs:
        - name: thefractalspace
          port: 80
      timeouts:
        request: 600s

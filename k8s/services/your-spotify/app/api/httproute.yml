---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: your-spotify-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: your-spotify
  hostnames:
    - ys-api.lama-corp.space
  rules:
    - matches:
        - path:
            value: "/"
      backendRefs:
        - name: your-spotify-api
          port: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: your-spotify-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsUser: 1674
        runAsGroup: 1674
        fsGroup: 1674
      containers:
        - name: api
          image: docker.io/yooooomi/your_spotify_server
          env:
            - name: API_ENDPOINT
              value: https://ys-api.lama-corp.space
            - name: CLIENT_ENDPOINT
              value: https://ys.lama-corp.space
            - name: LOG_LEVEL
              value: debug
          envFrom:
            - secretRef:
                name: your-spotify-secrets
            - secretRef:
                name: your-spotify-mongodb-credentials
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: home-assistant
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-http01-eg
    cert-manager.io/private-key-algorithm: ECDSA
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    namespace: core-eg
    name: eg-http-bar
  listeners:
    - name: https
      hostname: home.phemma.fr
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: home-assistant-https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: home-assistant
  hostnames:
    - home.phemma.fr
  rules:
    - matches:
        - path:
            value: "/"
      backendRefs:
        - name: home-assistant
          port: 8123

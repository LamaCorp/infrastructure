---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dawarich
spec:
  parentRefs:
    - name: eg-http-bar
      namespace: core-eg
      sectionName: https
  hostnames:
    - tracks.lama-corp.space
  rules:
    - matches:
        - path:
            value: "/"
      backendRefs:
        - name: dawarich-web
          port: 80

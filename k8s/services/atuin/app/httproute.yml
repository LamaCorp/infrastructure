---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: atuin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-http01-eg
    cert-manager.io/private-key-algorithm: ECDSA
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    namespace: core-eg
    name: eg-http-public
  listeners:
    - name: https
      hostname: atuin.lama-corp.space
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: atuin-https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atuin
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: atuin
  hostnames:
    - atuin.lama-corp.space
  rules:
    - matches:
        - path:
            value: "/"
      backendRefs:
        - name: atuin
          port: 80

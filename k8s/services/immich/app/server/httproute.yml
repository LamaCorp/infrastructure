---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: immich
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-http01-eg
    cert-manager.io/private-key-algorithm: ECDSA
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    namespace: core-eg
    name: eg-http-bar
  listeners:
    - name: https
      hostname: photos.lama-corp.space
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: immich-https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: immich
  hostnames:
    - photos.lama-corp.space
  rules:
    - matches:
        - path:
            value: "/"
      backendRefs:
        - name: immich-server
          port: 2283
      timeouts:
        request: 600s

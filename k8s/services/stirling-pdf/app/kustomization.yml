---
kind: Kustomization

commonLabels:
  app.kubernetes.io/name: stirling-pdf

resources:
  - deployment.yml
  - httproute.yml
  - network-policy.yml
  - pvc.yml
  - secrets.yml
  - service.yml

configMapGenerator:
  - name: stirling-pdf-config-env
    literals:
      - SYSTEM_DEFAULTLOCALE=fr-FR
      - SYSTEM_GOOGLEVISIBILITY=false
      - SYSTEM_SHOWUPDATE=false

      - UI_APPNAME=PDF
      - UI_HOMEDESCRIPTION=Manipuler vos PDFs avec aisance
      - UI_APPNAMENAVBAR=PDF

      - METRICS_ENABLED=true

      - SECURITY_ENABLELOGIN=true
      - SECURITY_LOGINMETHOD=oauth2
      - SECURITY_SSOAUTOLOGIN=true
      - SECURITY_OAUTH2_ENABLED=true
      - SECURITY_OAUTH2_ISSUER=https://auth.lama-corp.space/application/o/stirling-pdf/
      - SECURITY_OAUTH2_SCOPES="openid, profile, email"
      - SECURITY_OAUTH2_USEASUSERNAME=preferred_username
      - SECURITY_OAUTH2_PROVIDER=authentik
      - SECURITY_OAUTH2_AUTOCREATEUSER=true
      - SECURITY_OAUTH2_BLOCKREGISTRATION=false

images:
  - name: docker.io/stirlingtools/stirling-pdf
    newTag: 3.0.0-fat@sha256:b0387d124f86ab095db6579f90cd5209a340ff216d12f85ed0beeef2ed6ae19c

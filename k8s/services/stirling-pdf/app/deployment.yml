---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: stirling-pdf
          image: docker.io/stirlingtools/stirling-pdf
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: stirling-pdf-config-env
          env:
            - name: SECURITY_OAUTH2_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: stirling-pdf-oidc-credentials
                  key: client_id
            - name: SECURITY_OAUTH2_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: stirling-pdf-oidc-credentials
                  key: client_secret
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /configs
              subPath: configs
            - name: data
              mountPath: /logs
              subPath: logs
            - name: data
              mountPath: /pipeline
              subPath: pipeline
            - name: data
              mountPath: /usr/share/tessdata
              subPath: tessdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stirling-pdf-data

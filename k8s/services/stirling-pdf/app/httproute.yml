---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: stirling-pdf
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-http01-eg
    cert-manager.io/private-key-algorithm: ECDSA
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    namespace: core-eg
    name: eg-http-public
  listeners:
    - name: https
      hostname: pdf.lama-corp.space
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: stirling-pdf-https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirling-pdf
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: stirling-pdf
  hostnames:
    - pdf.lama-corp.space
  rules:
    - matches:
        - path:
            value: "/"
      backendRefs:
        - name: stirling-pdf
          port: 80
      timeouts:
        request: 600s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: stirling-pdf
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: stirling-pdf
  oidc:
    provider:
      issuer: https://auth.lama-corp.space/application/o/stirling-pdf/
    clientID: stirling-pdf
    clientSecret:
      name: stirling-pdf-oidc-credentials
    scopes:
      - offline_access
    refreshToken: true

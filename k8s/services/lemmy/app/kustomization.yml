---
kind: Kustomization

commonLabels:
  app.kubernetes.io/name: lemmy

resources:
  - network-policy.yml
  - secrets.yml
  - lemmy
  - pictrs
  - lemmy-ui
  - httproute.yml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: lemmy-config
    files:
      - ./config/config.hjson
  - name: pictrs-config
    literals:
      - PICTRS__SERVER__ADDRESS=[::]:8080
      - PICTRS__MEDIA__VIDEO_CODEC=vp9
      - PICTRS__MEDIA__GIF__MAX_WIDTH=256
      - PICTRS__MEDIA__GIF__MAX_HEIGHT=256
      - PICTRS__MEDIA__GIF__MAX_AREA=65536
      - PICTRS__MEDIA__GIF__MAX_FRAME_COUNT=400
      - PICTRS__REPO__TYPE=sled
  - name: lemmy-ui-config
    literals:
      - LEMMY_UI_LEMMY_INTERNAL_HOST=lemmy:80
      - LEMMY_UI_LEMMY_EXTERNAL_HOST=lemmy.lama-corp.space
      - LEMMY_UI_HTTPS=true

images:
  - name: docker.io/dessalines/lemmy
    newTag: 0.19.21@sha256:839d72704b10d574a21dacab046d9369e241366e4092b950d801e821f779de29
  - name: docker.io/dessalines/lemmy-ui
    newTag: 0.19.20@sha256:ee4c620d8e933ab0266b8aaf0e78247455ab70a90eeb86f1548b7e2aa87c9d40
  - name: docker.io/asonix/pictrs
    newTag: 0.5.25@sha256:6c64d7d282b67931716861b92bce48392791b57b571f5b7bbe132a10b4f0c39e

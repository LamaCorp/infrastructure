---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: hubble-ui
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-http01-eg
    cert-manager.io/private-key-algorithm: ECDSA
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    namespace: core-eg
    name: eg-http-public
  listeners:
    - name: https
      hostname: hubble.k3s.fsn.as212024.net
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: hubble-ui-https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: hubble-ui
  hostnames:
    - hubble.k3s.fsn.as212024.net
  rules:
    - matches:
        - path:
            value: "/"
      backendRefs:
        - name: hubble-ui
          port: 80

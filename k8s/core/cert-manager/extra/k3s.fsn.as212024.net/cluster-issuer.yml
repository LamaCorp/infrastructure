---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns01
spec:
  acme:
    email: caa@lama-corp.space
    server: https://acme-v02.api.letsencrypt.org/directory
    profile: tlsserver
    disableAccountKeyGeneration: true
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          rfc2136:
            nameserver: "[2001:67c:17fc::53]:53"
            tsigKeyName: k8s_k3s-fsn-as212024-net_core-cert-manager
            tsigAlgorithm: HMACSHA512
            tsigSecretSecretRef:
              name: tsig-key
              key: secret
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-http01-eg-http-critical
spec:
  acme:
    email: caa@lama-corp.space
    server: https://acme-v02.api.letsencrypt.org/directory
    profile: tlsserver
    disableAccountKeyGeneration: true
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: eg-http-critical
                namespace: core-eg
                sectionName: http
---
